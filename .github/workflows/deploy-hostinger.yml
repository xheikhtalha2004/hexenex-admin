name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hexenex-erp-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HOSTINGER_HOST: ${{ vars.HOSTINGER_HOST || '145.79.25.119' }}
      HOSTINGER_PORT: ${{ vars.HOSTINGER_PORT || '65002' }}
      HOSTINGER_USER: ${{ vars.HOSTINGER_USER || 'u571486348' }}
      HOSTINGER_APP_DIR: ${{ vars.HOSTINGER_APP_DIR || '/home/u571486348/domains/hexenex.com/public_html/erp' }}
      HOSTINGER_BASE_URL: ${{ vars.HOSTINGER_BASE_URL || 'https://erp.hexenex.com' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Build API
        working-directory: api
        run: |
          npm install
          npm run build

      - name: Build web app
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Prepare Linux production dependencies
        working-directory: api
        run: npm prune --omit=dev

      - name: Create deployment bundle
        run: |
          mkdir -p .deploy-bundle/web
          cp -R api/dist          .deploy-bundle/dist
          cp -R api/prisma        .deploy-bundle/prisma
          cp -R api/node_modules  .deploy-bundle/node_modules
          cp -R web/out           .deploy-bundle/web/out
          cp api/package.json api/package-lock.json .deploy-bundle/
          tar -czf release.tar.gz -C .deploy-bundle .
          echo "Bundle size: $(du -sh release.tar.gz | cut -f1)"

      - name: Install sshpass
        run: |
          test -n "${{ secrets.HOSTINGER_SSH_PASSWORD }}"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Upload and activate release
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          SSH="sshpass -e ssh -p $HOSTINGER_PORT \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=6 \
            -o ConnectTimeout=30 \
            ${HOSTINGER_USER}@${HOSTINGER_HOST}"

          REMOTE_ARCHIVE="/home/${HOSTINGER_USER}/release-${GITHUB_SHA}.tar.gz"

          # Upload: pipe the archive through SSH cat — no SFTP/scp required.
          echo "Uploading release bundle ($(du -sh release.tar.gz | cut -f1))..."
          $SSH "cat > '$REMOTE_ARCHIVE'" < release.tar.gz
          echo "Upload complete."

          # Verify the remote file arrived intact.
          LOCAL_SIZE=$(stat --format="%s" release.tar.gz)
          REMOTE_SIZE=$($SSH "stat --format='%s' '$REMOTE_ARCHIVE'")
          if [[ "$LOCAL_SIZE" != "$REMOTE_SIZE" ]]; then
            echo "Size mismatch: local=$LOCAL_SIZE remote=$REMOTE_SIZE" >&2
            $SSH "rm -f '$REMOTE_ARCHIVE'" || true
            exit 1
          fi

          # Run the deployment script on the server.
          echo "Activating release..."
          $SSH "bash -s -- '$HOSTINGER_APP_DIR' '$REMOTE_ARCHIVE'" < scripts/hostinger-deploy.sh
          echo "Activation complete."

      - name: Verify production
        run: |
          base_url="$HOSTINGER_BASE_URL"
          host="$(printf '%s' "$base_url" | sed -E 's|https?://([^/:]+).*|\1|')"
          # Use --resolve so the check works even during DNS propagation.
          curl_opts=(
            --fail --silent --show-error
            --retry 6 --retry-delay 5
            --resolve "${host}:443:${HOSTINGER_HOST}"
            --resolve "${host}:80:${HOSTINGER_HOST}"
            -k
          )
          echo "Fetching $base_url/login/ ..."
          page="$(curl "${curl_opts[@]}" "$base_url/login/")"
          css="$(printf '%s' "$page" | grep -oE '/_next/static/chunks/[^"]+\.css' | head -n1)"
          js="$(printf '%s' "$page"  | grep -oE '/_next/static/chunks/[^"]+\.js'  | head -n1)"
          [[ -n "$css" ]] || { echo "No CSS asset found in login page HTML" >&2; exit 1; }
          [[ -n "$js"  ]] || { echo "No JS asset found in login page HTML"  >&2; exit 1; }
          curl "${curl_opts[@]}" --output /dev/null "$base_url$css"
          curl "${curl_opts[@]}" --output /dev/null "$base_url$js"
          echo "Production verification passed."
