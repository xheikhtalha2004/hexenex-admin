name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hexenex-erp-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOSTINGER_HOST: ${{ vars.HOSTINGER_HOST || '145.79.25.119' }}
      HOSTINGER_PORT: ${{ vars.HOSTINGER_PORT || '65002' }}
      HOSTINGER_USER: ${{ vars.HOSTINGER_USER || 'u571486348' }}
      HOSTINGER_APP_DIR: ${{ vars.HOSTINGER_APP_DIR || '/home/u571486348/domains/hexenex.com/public_html/erp' }}
      HOSTINGER_BASE_URL: ${{ vars.HOSTINGER_BASE_URL || 'https://erp.hexenex.com' }}
      HOSTINGER_SSH_PASSWORD: ${{ secrets.HOSTINGER_SSH_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json

      - name: Build API
        working-directory: api
        run: |
          # Refresh platform-specific optional dependencies on the Linux runner.
          npm install
          npm run build

      - name: Build web app
        working-directory: web
        run: |
          npm install
          npm run build

      - name: Prepare Linux production dependencies
        working-directory: api
        run: npm prune --omit=dev

      - name: Create deployment bundle
        run: |
          mkdir -p .deploy-bundle/web
          cp -R api/dist .deploy-bundle/dist
          cp -R api/prisma .deploy-bundle/prisma
          cp -R api/node_modules .deploy-bundle/node_modules
          cp -R web/out .deploy-bundle/web/out
          cp api/package.json api/package-lock.json .deploy-bundle/
          tar -czf "hostinger-${GITHUB_SHA}.tar.gz" -C .deploy-bundle .

      - name: Install SSH password helper
        run: |
          test -n "$HOSTINGER_SSH_PASSWORD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Trust Hostinger SSH host key
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p "$HOSTINGER_PORT" -H "$HOSTINGER_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload and activate release
        env:
          SSHPASS: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
        run: |
          remote_archive="/home/${HOSTINGER_USER}/hostinger-${GITHUB_SHA}.tar.gz"
          ssh_opts=(-p "$HOSTINGER_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=30)

          echo "Streaming release bundle to Hostinger via SSH..."
          success=0
          for attempt in 1 2 3; do
            echo "Upload attempt $attempt of 3..."
            if sshpass -e ssh "${ssh_opts[@]}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" "cat > '$remote_archive'" < "hostinger-${GITHUB_SHA}.tar.gz"; then
              success=1
              break
            fi
            echo "Upload attempt $attempt failed, retrying in 5 seconds..."
            sleep 5
          done

          if [[ $success -ne 1 ]]; then
            echo "Failed to upload release archive after 3 attempts." >&2
            exit 1
          fi

          echo "Activating release on Hostinger..."
          sshpass -e ssh "${ssh_opts[@]}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" \
            "bash -s -- '$HOSTINGER_APP_DIR' '$remote_archive'" < scripts/hostinger-deploy.sh

      - name: Verify production
        run: |
          base_url="$HOSTINGER_BASE_URL"
          host_header="$(printf '%s' "$base_url" | sed -E 's|https?://([^/:]+).*|\1|')"
          curl_opts=(--fail --silent --show-error --retry 5 --retry-delay 3 -k)
          if [[ -n "$HOSTINGER_HOST" && -n "$host_header" ]]; then
            curl_opts+=(--resolve "${host_header}:443:${HOSTINGER_HOST}" --resolve "${host_header}:80:${HOSTINGER_HOST}")
          fi
          login_html="$(curl "${curl_opts[@]}" "$base_url/login/")"
          css_path="$(printf '%s' "$login_html" | grep -oE '/_next/static/chunks/[^"]+\.css' | head -n 1)"
          js_path="$(printf '%s' "$login_html" | grep -oE '/_next/static/chunks/[^"]+\.js' | head -n 1)"
          test -n "$css_path"
          test -n "$js_path"
          curl "${curl_opts[@]}" --output /dev/null "$base_url$css_path"
          curl "${curl_opts[@]}" --output /dev/null "$base_url$js_path"
          echo "Production verification succeeded."
